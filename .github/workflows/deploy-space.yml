name: "Deploy backend to Hugging Face Space"

# The Space needs a README.md carrying its own YAML frontmatter at the repo
# root, which would look wrong on GitHub. So rather than syncing this repo
# wholesale, this builds a clean tree containing only what the backend needs
# and pushes that. Nothing here touches the GitHub repo's own history.

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "articlegen/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "Dockerfile"
      - "deploy/space-README.md"
      - ".github/workflows/deploy-space.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Without the token the job can't do anything; skip rather than fail red.
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository_owner == 'bartholomewtj' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for the Hugging Face token
        id: guard
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Report the length, never the value. "Set but empty" is a distinct
          # failure from "never set" — `gh secret set` stores an empty string if
          # the paste doesn't register before you press enter, and the resulting
          # skip is otherwise indistinguishable from having done nothing at all.
          echo "HF_TOKEN length: ${#HF_TOKEN}"
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::HF_TOKEN is empty or unset — skipping deploy."
            echo "If you already ran 'gh secret set HF_TOKEN', the paste did not"
            echo "register. Re-run it and check the value pasted before pressing enter."
            echo "See deploy/README.md for the one-time setup."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble the Space tree
        if: steps.guard.outputs.ready == 'true'
        run: |
          mkdir -p /tmp/space
          cp -r articlegen /tmp/space/
          cp requirements.txt pyproject.toml Dockerfile /tmp/space/
          cp deploy/space-README.md /tmp/space/README.md
          find /tmp/space -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Push to the Space
        if: steps.guard.outputs.ready == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE || 'bartholomewtj/articlegen' }}
        run: |
          cd /tmp/space
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sync from ${GITHUB_SHA::7}"
          # The Space tree is generated, so its history is disposable; force-push
          # a single fresh commit rather than trying to keep the two in step.
          git push -q --force \
            "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" \
            main
          echo "Deployed to https://huggingface.co/spaces/${HF_SPACE}"
