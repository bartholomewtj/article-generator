name: "Ideas (open a 'theme: ...' issue)"

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  ideas:
    # Only for issues titled "theme: ..." opened by people with write access
    # (prevents strangers on a public repo from spending your API credits).
    if: >-
      startsWith(github.event.issue.title, 'theme:') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ideas-${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Generate ideas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ARTICLEGEN_PROVIDER: ${{ vars.ARTICLEGEN_PROVIDER }}
          THEME: ${{ github.event.issue.title }}
          GUIDANCE: ${{ github.event.issue.body }}
        run: |
          set -o pipefail
          python -m articlegen.bot ideas --theme "$THEME" --guidance "$GUIDANCE" \
            --out /tmp/ideas_comment.md 2>&1 | tee /tmp/run_log.txt

      - name: Post ideas as a comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh issue comment ${{ github.event.issue.number }}
          --repo ${{ github.repository }}
          --body-file /tmp/ideas_comment.md

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_SET: ${{ secrets.GEMINI_API_KEY != '' }}
          GOOGLE_SET: ${{ secrets.GOOGLE_API_KEY != '' }}
          ANTHROPIC_SET: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          PROVIDER_VAR: ${{ vars.ARTICLEGEN_PROVIDER }}
        run: |
          {
            echo "⚠️ Idea generation failed ([full log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))."
            echo ""
            echo "**Provider config this run saw:**"
            echo "- \`GEMINI_API_KEY\` secret present: **${GEMINI_SET}**"
            echo "- \`GOOGLE_API_KEY\` secret present: ${GOOGLE_SET}"
            echo "- \`ANTHROPIC_API_KEY\` secret present: ${ANTHROPIC_SET}"
            echo "- \`ARTICLEGEN_PROVIDER\` variable: \`${PROVIDER_VAR:-（unset）}\`"
            if [ -s /tmp/run_log.txt ]; then
              echo ""
              echo "<details><summary>Error detail</summary>"
              echo ""
              echo '```'
              tail -n 12 /tmp/run_log.txt
              echo '```'
              echo "</details>"
            fi
          } > /tmp/fail_comment.md
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} --body-file /tmp/fail_comment.md
