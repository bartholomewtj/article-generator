name: "Publish drafts to GitHub Pages"

# Publishes the drafts/ folder to GitHub Pages so every article has a clean,
# tappable web-page URL (site root = drafts/, so the queue index.html is the
# landing page and each article lives at /<stem>.html).
#
# One-time setup: Settings → Pages → Source: "GitHub Actions". Nothing else to
# configure — this workflow deploys on every push that touches drafts/.

on:
  push:
    paths:
      - "drafts/**"
  workflow_dispatch:

# Least-privilege token plus the two scopes the deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deploys; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only publish from the repo's default branch (drafts are committed there);
    # referenced dynamically so a future rename to `main` needs no edit here.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Upload drafts/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: drafts

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
