name: "Deploy Mobile Web App to GitHub Pages"

# Push triggers silently stopped firing on 6 Aug 2026 after a Pages deployment
# timed out mid-flight (issue #71); workflow_dispatch kept working throughout.
# A no-op edit did NOT re-register the triggers (verified: 20-minute watch, no
# run), so the file was renamed from pages.yml — a new filename makes GitHub
# register it as a new workflow with fresh triggers. If pushes go quiet again:
# `gh workflow run deploy-pages.yml --ref main` deploys, and NEVER re-run a
# failed Pages deploy — the rerun double-uploads the artifact and fails on that.
on:
  push:
    branches:
      - main
      - "claude/**"
      - "master"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # The site is static, so a broken commit deploys just as happily as a good
  # one. This gate is the only thing standing between a failing test and the
  # live page. Duplicated here rather than depending on the Tests workflow:
  # `workflow_run` fires *after* a separate run completes and cannot block this
  # one, so a needs: gate in the same workflow is what actually holds.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Offline tests
        run: python tests/test_offline.py

      - name: Journal format conformance
        run: python tests/test_journal_conformance.py

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Pages serves index.html with Cache-Control: max-age=600, so for ten
      # minutes after a deploy a browser can show the old page while the server
      # has the new one, with nothing on the page to say which. This is the
      # front end's answer to the question /api/health answers for the backend.
      # It edits the checkout, never the repo — the placeholder stays in git.
      - name: Stamp the build into index.html
        run: |
          SHA="$(git rev-parse --short=7 HEAD)"
          # Match the stamp markup itself, not the bare token: the token also
          # appears in prose nearby, and a guard that accepted that would pass
          # while the stamp element had quietly lost its placeholder.
          if ! grep -q "build <code>__BUILD_COMMIT__</code>" index.html; then
            echo "::error::index.html has no __BUILD_COMMIT__ placeholder. The build stamp would silently stop updating, which is exactly the failure it exists to make visible."
            exit 1
          fi
          sed -i "s/__BUILD_COMMIT__/$SHA/g" index.html
          echo "Stamped index.html with $SHA"
          grep -o "build <code>$SHA</code>" index.html

      - name: Assemble Pages site without drafts
        run: |
          # drafts/ is the local CLI review surface. Keep it in the repo;
          # do not put it on the public site.
          mkdir _site
          rsync -a --exclude '.git' --exclude 'drafts' --exclude '_site' ./ _site/
          if [ -e _site/drafts ]; then
            echo "::error::drafts/ leaked into the Pages artifact"
            exit 1
          fi
          test -f _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
